<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Dayana</title>
    <style>
        body { background-color: #fce4ec; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .envelope { width: 280px; height: 180px; background: #ef5350; position: relative; cursor: pointer; transition: 0.5s; }
        .envelope:before { content: ""; position: absolute; top: 0; z-index: 2; border-left: 140px solid transparent; border-right: 140px solid transparent; border-top: 90px solid #e57373; transform-origin: top; transition: 0.5s; }
        .letter { position: absolute; top: 5px; left: 10px; width: 260px; transition: 0.5s; z-index: 1; opacity: 0; }
        .letter img { width: 100%; border-radius: 5px; }
        .open:before { transform: rotateX(180deg); z-index: 0; }
        .open .letter { transform: translateY(-100px); z-index: 3; opacity: 1; }
        .tap { position: absolute; bottom: 15%; color: #c62828; font-family: sans-serif; font-size: 14px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="tap">Toca el sobre, Dayana ❤️</div>
    <div class="envelope" onclick="this.classList.toggle('open')">
        <div class="letter">
            <img src="carta.jpg">
        </div>
    </div>
</body>
</html>
