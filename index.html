<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Dayana - Un Jardín para Ti</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; color: white; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #stars { position: absolute; width: 100%; height: 100%; background-image: 
            radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
            radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
            radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
          background-size: 550px 550px, 350px 350px, 250px 250px;
          background-position: 0 0, 40px 60px, 130px 270px;
          z-index: 0; }
        h1 { position: relative; font-size: 1.8rem; text-shadow: 0 0 10px #ffeb3b; z-index: 2; color: #ffeb3b; }
        .intro-text { position: relative; font-size: 1rem; color: #fce4ec; z-index: 2; margin-top: 20px; text-shadow: 0 0 5px #f48fb1; }
        #initial-sunflower { position: relative; width: 150px; cursor: pointer; z-index: 2; margin-top: 30px; animation: glow 2s infinite alternate; }
        @keyframes glow { from { box-shadow: 0 0 10px #ffc107; } to { box-shadow: 0 0 25px #ffeb3b; } }
        #garden-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .flower-cluster { position: absolute; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); cursor: help; }
        .flower-cluster img { max-width: 60px; height: auto; }
        .flower-text { font-size: 0.8rem; text-align: center; color: #fff3e0; opacity: 0; transition: opacity 0.5s; text-shadow: 0 0 5px #000; background-color: rgba(0,0,0,0.4); padding: 3px; border-radius: 5px; }
        .flower-cluster:hover .flower-text { opacity: 1; }
        @keyframes drift { from { transform: translate(-50%, -50%) translate(-10px, -10px); } to { transform: translate(-50%, -50%) translate(10px, 10px); } }
    </style>
</head>
<body>
    <div id="stars"></div>
    <div id="main-scene">
        <h1>Para Dayana ❤️</h1>
        <div class="intro-text">Para todas las chicas que no han recibido sus flores...</div>
        <img id="initial-sunflower" src="https://static.wixstatic.com/media/2ccac3_b45a0b76e5d84713a52e04e902b4d32f~mv2.png/v1/fill/w_440,h_440,al_c,q_85,usm_0.66_1.00_0.01,enc_auto/Girasol%20grande.png" alt="Girasol central" onclick="startGarden()">
    </div>
    <div id="garden-container">
        <h1>Este jardín virtual es solo para ti</h1>
    </div>
    <script>
        const sunflower_image = "https://static.wixstatic.com/media/2ccac3_b45a0b76e5d84713a52e04e902b4d32f~mv2.png/v1/fill/w_440,h_440,al_c,q_85,usm_0.66_1.00_0.01,enc_auto/Girasol%20grande.png";
        const rose_image = "https://img1.picmix.com/output/pic/normal/3/7/2/6/10296273_24d9f.png"; // Rosa roja
        const lily_image = "https://w7.pngwing.com/pngs/351/319/png-transparent-lily-lilia-white-lily-miscellaneous-white-flower-arrangement.png"; // Lirio blanco
        const tulip_image = "https://img1.picmix.com/output/pic/normal/4/0/1/4/10414104_f1b34.png"; // Tulipán rosa
        const orchid_image = "https://w7.pngwing.com/pngs/998/182/png-transparent-phalaenopsis-equestris-orchid-orchidee-flower-moth-orchids-orchis.png"; // Orquídea
        const bouquet_image = "https://pngimg.com/uploads/rose/rose_PNG1002.png"; // Ramo de flores
        const messages = [
            { text: "Mi flor favorita eres tú", img: sunflower_image },
            { text: "Contigo soy muy feliz", img: rose_image },
            { text: "Eres pura alegría, de verdad", img: lily_image },
            { text: "Me encanta verte sonreír", img: tulip_image },
            { text: "Tu compañía es lo mejor", img: bouquet_image },
            { text: "Gracias por estar en mi vida", img: orchid_image },
            { text: "Todo se solucionó y eso me hace feliz", img: sunflower_image },
            { text: "Te amo mucho, Dayana", img: rose_image },
            { text: "Este jardín es solo para ti ❤️", img: bouquet_image },
            { text: "Eres única, recuérdalo siempre", img: tulip_image },
            { text: "Eres mi prioridad, TQM", img: orchid_image }
        ];
        function startGarden() {
            document.getElementById('main-scene').style.display = 'none';
            document.getElementById('garden-container').style.display = 'block';
            const container = document.getElementById('garden-container');
            for (let i = 0; i < messages.length; i++) {
                const cluster = document.createElement('div');
                cluster.className = 'flower-cluster';
                cluster.style.top = `${Math.random() * 80 + 10}%`;
                cluster.style.left = `${Math.random() * 80 + 10}%`;
                cluster.style.animation = `drift ${Math.random() * 4 + 3}s infinite alternate ease-in-out`;
                const img = document.createElement('img');
                img.src = messages[i].img;
                img.alt = "Flor";
                const text = document.createElement('div');
                text.className = 'flower-text';
                text.textContent = messages[i].text;
                cluster.appendChild(img);
                cluster.appendChild(text);
                container.appendChild(cluster);
            }
        }
    </style>
</head>
<body>
</body>
        </html>
