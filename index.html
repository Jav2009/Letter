<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores para Dayana</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #stars { position: absolute; width: 100%; height: 100%; background: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px); background-size: 100px 100px; z-index: 0; opacity: 0.3; }
        .main-container { text-align: center; z-index: 1; }
        h1 { color: #ffd700; text-shadow: 0 0 15px #ffd700; font-size: 26px; margin-bottom: 20px; }
        .sunflower-btn { width: 140px; cursor: pointer; animation: pulse 2s infinite; filter: drop-shadow(0 0 10px #ffdb58); }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        #garden { display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; background: #000; }
        .flower-box { position: absolute; text-align: center; animation: float 5s infinite alternate ease-in-out; }
        .flower-box img { width: 80px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.5)); }
        .phrase { color: #fff; font-size: 11px; margin-top: 5px; text-shadow: 0 0 5px #000; background: rgba(0,0,0,0.5); padding: 2px 5px; border-radius: 5px; font-weight: bold; }
        @keyframes float { from { transform: translate(0, 0) rotate(-5deg); } to { transform: translate(10px, -20px) rotate(5deg); } }
        .final-title { color: #ffeb3b; position: absolute; top: 20px; width: 100%; text-align: center; font-size: 20px; text-shadow: 0 0 10px #000; }
    </style>
</head>
<body>
    <div id="stars"></div>
    
    <div class="main-container" id="start-screen">
        <h1>Para Dayana ❤️</h1>
        <img src="https://www.pngmart.com/files/1/Sunflower-PNG-Transparent-Image.png" class="sunflower-btn" onclick="openGarden()">
        <p style="color: #ffeb3b; margin-top: 15px;">Toca para iniciar</p>
    </div>

    <div id="garden">
        <h1 class="final-title">Un jardín infinito para ti ✨</h1>
    </div>

    <script>
        // Enlaces directos que funcionan (Girasol, Rosa roja, Tulipán, Margarita)
        const flowerImgs = [
            "https://www.pngmart.com/files/1/Sunflower-PNG-Transparent-Image.png",
            "https://www.pngmart.com/files/1/Red-Rose-PNG-Transparent-Image.png",
            "https://www.pngmart.com/files/21/Pink-Tulip-PNG-Clipart.png",
            "https://www.pngmart.com/files/1/Daisy-Flower-PNG-File.png"
        ];
        
        const messages = [
            "Mi flor favorita", "Eres única", "TQM Dayana", "Pura alegría", 
            "Brillas mucho", "Te extraño", "Siempre juntos", "Mi niña linda",
            "Eres especial", "Perdón por lo de hoy", "Te quiero mucho", "Eres luz"
        ];

        function openGarden() {
            document.getElementById('start-screen').style.display = 'none';
            const garden = document.getElementById('garden');
            garden.style.display = 'block';

            // Crear 15 flores aleatorias
            for (let i = 0; i < 15; i++) {
                const box = document.createElement('div');
                box.className = 'flower-box';
                box.style.left = Math.random() * 80 + 5 + "%";
                box.style.top = Math.random() * 80 + 10 + "%";
                box.style.animationDelay = Math.random() * 3 + "s";
                
                const img = document.createElement('img');
                img.src = flowerImgs[Math.floor(Math.random() * flowerImgs.length)];
                
                const txt = document.createElement('div');
                txt.className = 'phrase';
                txt.innerText = messages[Math.floor(Math.random() * messages.length)];
                
                box.appendChild(img);
                box.appendChild(txt);
                garden.appendChild(box);
            }
        }
    </script>
</body>
</html>
